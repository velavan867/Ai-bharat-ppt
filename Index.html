<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cyber Dragon - AI that teaches while building and builds while teaching.">
    
    <title>Cyber Dragon | AI Learning Platform</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styling -->
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col text-white">

    <!-- ================= HEADER ================= -->
    <header class="py-6 text-center border-b border-slate-700">
        <h1 class="text-4xl font-bold text-blue-400 tracking-wide">
            🐉 CYBER DRAGON
        </h1>
        <p class="text-gray-400 mt-2">
            The AI that teaches while building & builds while teaching.
        </p>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="flex-grow flex items-center justify-center px-4 py-10">
        
        <section class="bg-slate-800 w-full max-w-3xl p-8 rounded-2xl shadow-2xl">

            <!-- Prompt Input -->
            <label for="prompt" class="block text-lg font-semibold mb-2 text-blue-300">
                Ask Your AI Mentor
            </label>

            <textarea 
                id="prompt"
                rows="5"
                placeholder="Explain this code... Generate a function... Debug an error..."
                class="w-full p-4 rounded-xl text-black resize-none focus:outline-none focus:ring-2 focus:ring-blue-500">
            </textarea>

            <!-- Button -->
            <button 
                onclick="sendPrompt()"
                class="mt-4 w-full bg-blue-600 hover:bg-blue-700 transition-all duration-300 p-3 rounded-xl font-semibold text-lg">
                Ask AI
            </button>

            <!-- Loading Indicator -->
            <div id="loading" class="hidden mt-4 text-yellow-400 font-medium">
                ⏳ Thinking...
            </div>

            <!-- Response Section -->
            <div class="mt-6">
                <h3 class="text-blue-400 font-semibold text-lg">AI Response</h3>
                <div 
                    id="response"
                    class="mt-2 bg-slate-900 p-5 rounded-xl min-h-[120px] text-gray-200 whitespace-pre-wrap border border-slate-700">
                </div>
            </div>

        </section>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="text-center py-4 border-t border-slate-700 text-gray-400 text-sm">
        © 2026 Cyber Dragon | AI for Learning & Developer Productivity
    </footer>

    <!-- ================= SCRIPT ================= -->
    <script>
        async function sendPrompt() {
            const prompt = document.getElementById("prompt").value.trim();
            const responseBox = document.getElementById("response");
            const loading = document.getElementById("loading");

            if (!prompt) {
                responseBox.innerHTML = "⚠️ Please enter a question.";
                return;
            }

            responseBox.innerHTML = "";
            loading.classList.remove("hidden");

            try {
                const res = await fetch("http://127.0.0.1:8000/ask-ai", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!res.ok) {
                    throw new Error("Server error");
                }

                const data = await res.json();
                responseBox.innerHTML = data.response;

            } catch (error) {
                responseBox.innerHTML = "❌ Unable to connect to AI backend.";
                console.error(error);
            } finally {
                loading.classList.add("hidden");
            }
        }
    </script>

</body>
</html>
